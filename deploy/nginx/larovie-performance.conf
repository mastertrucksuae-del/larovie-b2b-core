# Larovié wholesale — nginx performance directives (Laravel Forge)
#
# WHY THIS IS NOT IN THE REPO'S CONTROL
#   nginx serves everything under public/ directly, without ever invoking PHP,
#   so caching and compression for static assets cannot be set from Laravel.
#   Forge's site template sets neither, which fails the PageSpeed audit
#   "Serve static assets with an efficient cache policy" — verified live on
#   2026-08-10: /build/*.css, /storage/*.webp and /images/*.png all came back
#   with no Cache-Control header at all, so every repeat visit re-downloaded
#   ~320KB of brand logos plus the stylesheet.
#
# HOW TO APPLY (manual — Forge does not read this file from the repo)
#   Forge → Server → Sites → wholesale.larovie.com → Nginx Configuration.
#   Paste everything below into the server { } block, immediately ABOVE the
#   line `location / {`. Save; Forge validates and reloads nginx itself.
#   Re-apply if Forge ever regenerates the site config.
#
# TWO THINGS TO KNOW ABOUT THIS CONFIG
#   1. nginx `add_header` does NOT merge with parent scope — declaring one
#      inside a location DISCARDS every add_header inherited from server level.
#      The site block sets X-Frame-Options / X-XSS-Protection /
#      X-Content-Type-Options there, so each location below re-declares all
#      three verbatim. Applying this file therefore changes nothing about the
#      headers you already serve; it only adds Cache-Control.
#   2. These are prefix (^~) locations on real static directories, deliberately
#      NOT a `\.(css|js)$` regex. A regex on extensions would also capture
#      /livewire-*/livewire.js — a dynamic PHP route that already sets its own
#      Cache-Control — producing two conflicting Cache-Control headers.

# ---------------------------------------------------------------------------
# Compression. Forge enables gzip globally but with a narrow gzip_types list.
# woff2/webp/png are already compressed and are deliberately excluded.
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# ---------------------------------------------------------------------------
# Vite build output. Every filename is content-hashed (app-DPOnLIOb.css,
# cairo-400-normal-Dh7otpdh.woff2), so a given name's bytes never change.
# ---------------------------------------------------------------------------
location ^~ /build/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri =404;
}

# ---------------------------------------------------------------------------
# Admin uploads (brand logos, product image overrides). Filenames are ULIDs
# generated per upload, so a replaced image gets a new name — but these are not
# content-hashed, so 30 days rather than immutable.
# ---------------------------------------------------------------------------
location ^~ /storage/ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri =404;
}

# ---------------------------------------------------------------------------
# Bundled brand marks shipped in the repo. Not fingerprinted — a week keeps a
# logo swap from being stuck in caches while still passing the audit.
# ---------------------------------------------------------------------------
location ^~ /images/ {
    access_log off;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri =404;
}

# ---------------------------------------------------------------------------
# OPTIONAL — brotli beats gzip by ~15-20% on text, but the module is not
# installed by default on Forge images. Uncommenting without it makes nginx
# refuse to reload ("unknown directive brotli"), taking the site's config down
# on save. Install first:  sudo apt install libnginx-mod-http-brotli
# ---------------------------------------------------------------------------
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
