# Larovié wholesale — nginx performance directives (Laravel Forge / nginx)
#
# Static assets under public/ are served by nginx directly and never reach PHP,
# so caching and compression for them cannot be handled from the application.
# Forge's default site template sets neither, which fails two PageSpeed audits:
#   - "Serve static assets with an efficient cache policy"
#   - "Enable text compression"
#
# HOW TO APPLY
#   Forge → Server → Sites → wholesale.larovie.com → Nginx Configuration
#   Paste the two blocks below INSIDE the existing `server { ... }` block,
#   above the `location / { try_files ... }` line, then save (Forge reloads
#   nginx for you). Re-apply after any Forge nginx template reset.
#
# NOTE ON HTTPS
#   Forge terminates TLS and adds the certificate config itself — do not add
#   listen/ssl_certificate directives here.

# ---------------------------------------------------------------------------
# 1. Compression
# ---------------------------------------------------------------------------
# Forge enables gzip globally in /etc/nginx/nginx.conf but with a narrow
# gzip_types list; these lines widen it for this site. Fonts are already
# compressed (woff2) — deliberately excluded.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    image/svg+xml;

# Brotli beats gzip by ~15-20% on text. Only active if the module is installed
# (`apt install libnginx-mod-http-brotli` on Forge's Ubuntu images). Wrapped so
# a missing module does not break the config — remove this block if nginx
# refuses to reload with "unknown directive brotli".
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

# ---------------------------------------------------------------------------
# 2. Cache policy
# ---------------------------------------------------------------------------
# Vite fingerprints every file under /build (app-CsP_5s9n.css, cairo-400-*.woff2),
# so the content behind a given name never changes — safe to cache immutably.
location ^~ /build/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Un-fingerprinted static files (logos, favicon, admin uploads under /storage).
# A month, revalidated — long enough to pass the audit, short enough that a
# replaced logo is not stuck in caches for a year.
location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri /index.php?$query_string;
}
